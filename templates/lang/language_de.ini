Z3_09 = "Virtueller Eingang (Schalter) | Wassermelder (eigene Quelle) | 1 = Wasser erkannt; im eigenen Projekt die Leitung vom eigenen Wassermelder statt dieses Schalters an Nr. 10 legen | —"
Z3_10 = "Virtueller Ausgang Befehl (Vorlage „LoxBerry MQTT-Gateway“, MQTT) | Sprachsteuerung: Alarmansage | Befehl bei EIN: publish %1$s/befehl/alarm Wasseralarm im Keller (nie retain); spricht dringend – auch in der Ruhezeit und wenn Loxone stillgelegt hat; Haken wie Nr. 3 | Eingang = #9"
