S1_TITEL = "Schritt 1: MQTT einrichten"
S3_TEXT = "Ein virtueller HTTP-Eingang, der den Zustand holt. Wichtig sind vor allem <span class='sm-mono'>BEREIT</span> - wie viele Mikrofone gerade wirklich verbunden sind - und <span class='sm-mono'>DIENSTE</span>: ein toter Whisper-Container sieht sonst genauso aus wie eine gesunde Anlage. Ein Mikrofon, das seit Tagen nicht antwortet, fällt niemandem auf, bis man davor steht und redet."
S3_TITEL = "Schritt 2: Zustand der Anlage überwachen"
S4_ANSAGE = "<b>Das ist mehr wert, als es klingt.</b> Eine Ansage 'Das Garagentor steht seit einer Stunde offen' im richtigen Raum erreicht mehr als jede Meldung auf einem Bildschirm, den niemand ansieht. Und der Satzweg macht die Sprachlogik auch für Taster nutzbar."
S4_TEXT = "Es geht auch andersherum: Loxone kann die Anlage etwas sagen lassen, ihr einen Satz unterschieben, als hätte ihn jemand gesprochen, oder die Ansagen stilllegen. Ein <i>Virtueller Ausgang</i> mit der Adresse des LoxBerry genügt - oder gleich die fertige Vorlage von oben."
S4_TITEL = "Schritt 3: Loxone spricht"
S5_TEXT = "Der Endpunkt liegt im unangemeldeten Bereich, damit Loxone ihn ohne Zugangsdaten erreicht, und ist deshalb durch ein Token geschützt. Mit <span class='sm-mono'>?selftest=1</span> lässt sich prüfen, ob es noch stimmt, <b>ohne dass etwas passiert</b> - die Alternative wäre, das Haus zum Reden zu bringen. Ein neues Token macht alle bereits eingetragenen Adressen ungültig."
S5_TITEL = "Schritt 4: Das Token"
S6_ERLAEUTERUNG = "<b>Zu #3, #4 und #5:</b> Diese drei sind virtuelle Eingänge für TEXT, keine Zahlen. In Loxone Config ist das der Haken 'Als Text verwenden' - ohne ihn kommt bei <span class='sm-mono'>ein</span> eine 0 an.<br><b>Zu #8 und #9:</b> Erst die UND-Verknüpfung mit dem Ziel macht den Befehl eindeutig. Ohne sie schaltet 'Licht aus' in der Küche auch das Wohnzimmer.<br><b>Zu #11:</b> Die Schwelle liegt bewusst hoch. Wer eine halbe Stunde nichts sagt, hat keine Störung - er hat nur nichts gesagt. Gemeint ist das ALTER des Abbilds, nicht die Zeit seit dem letzten Satz.<br><b>Zu #13 und #15:</b> Der Benachrichtigungs-Baustein sendet nur beim Wechsel von Aus auf Ein. Niemals mehrere Quellen direkt an seinen Eingang legen, sondern erst über ein ODER zusammenführen.<br><b>Zu #16 und #17:</b> Der Rückweg. Damit sagt die Anlage von sich aus Bescheid - und hält nachts den Mund."
S6_TEXT = "Nachgebaut wird: ein gesprochener Befehl schaltet eine Lichtgruppe, der Ausfall der Sprachkette wird gemeldet, und nachts schaltet Loxone die Ansagen still. Loxone Config führt alle Bausteine in der Baustein-Suche (F5)."
S6_TITEL = "Schritt 5: Komplette Baustein-Liste zum 1:1-Nachbauen"
S7_TEXT = "Diese Adressen im Browser aufrufen. Der erste sagt, ob das Token stimmt, ohne dass etwas passiert."
S7_TITEL = "Schritt 6: Gegenprobe"
TOKEN_NEU = "Es wurde ein neues Token erzeugt. <b>Die Adressen in Loxone müssen angepasst werden.</b>"
