Z3_18 = "Virtueller Ausgang Befehl (Vorlage „LoxBerry MQTT-Gateway“, MQTT) | Sprachsteuerung: Ansagen stilllegen | Befehl bei EIN: publish %1$s/befehl/ruhe 1; Befehl bei AUS: publish %1$s/befehl/ruhe 0 (nie retain). Gilt auch für Ansagen, die andere Plugins über die Sprachsteuerung sprechen lassen (z. B. Intercom beim Klingeln); die Ruhezeit im Plugin dann ausgeschaltet lassen; wirkt mit dem Haken „Befehle über MQTT annehmen“ allein | Eingang = #17"
Z3_19 = "Virtueller Eingang (Name wie das MQTT-Gateway ihn vergibt, Plugin Sprachsteuerung) | sprachsteuerung_ansage_ok | Analog ein; Anzeigename „Letzte Ansage angekommen (Sprachsteuerung)“; 1 = angekommen, 0 = nicht, -1 = gesendet, Ausgang unklar; kommt nur mit „Dauerhafte Verbindung zum Broker“ (Plugin Reiter MQTT, ab Werk aus) – ohne sie bleibt 0 stehen; nur Anzeige, keine Meldung daran | —"
