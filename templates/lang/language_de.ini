[MIKRO]
ANTWORTET = "antwortet"
ERKLAERUNG = "Zwei Familien, beide vollständig lokal:<br><b>Wyoming</b> - jeder Linux-Rechner mit Mikrofon, auf dem <span class='sm-mono'>wyoming-satellite</span> läuft. Ein Raspberry Pi Zero 2 W mit USB-Mikrofon kostet unter 30 Euro und genügt vollauf.<br><b>ESPHome</b> - die fertig kaufbaren Kleingeräte: M5Stack Atom Echo, Home Assistant Voice Preview Edition, ESP32-S3-BOX. Sie brauchen den Noise-Schlüssel aus ihrer ESPHome-Einrichtung."
ESPHOME_WARNUNG = "<b>Ehrliche Einordnung:</b> Bis 0.9.11 gab es diesen Weg gar nicht - das Gerät wurde verbunden, danach geschah nichts. Von 0.10.0 bis 0.10.2 waren die Rückrufe zwar eingetragen, aber unbrauchbar: die Bibliothek verlangt Koroutinen, es waren gewöhnliche Funktionen, und einer nahm ein Argument zu wenig. Es kam nie ein Ton an, und es ging kein einziges Ereignis zurück - das Gerät hielt sich für dauerhaft mitten in einer Anfrage. Seit 0.11.0 ist der Weg gegen das Originalpaket aioesphomeapi gebaut, seit 0.11.1 dazu gegen die ESPHome-<b>Firmware</b> selbst: sie liest aus jedem Ereignis bestimmte Werte und steigt bei leerem Wert aus - ohne Text im TTS_START startet sie den Lautsprecher nie, ohne Adresse im TTS_END wechselt sie nie in den Zustand, in dem der Puffer geleert wird. Das Audio wird außerdem getaktet, weil ihr Lautsprecherpuffer nur eine halbe Sekunde faßt. <b>Am Gerät gemessen ist der Weg weiterhin nicht</b> - hier steht keines. Ein Fehler dort reißt die Wyoming-Mikrofone nicht mit; jedes läuft für sich."
FEHLER_HOST = "Zeile %d: Das ist keine gültige Adresse."
FEHLER_HOST_FEHLT = "Zeile %d: Ein Mikrofon braucht eine Adresse."
FEHLER_PORT = "Zeile %d: Der Port muss eine Zahl von 1 bis 65535 sein."
FEHLER_ZONE = "Zeile %d: Eine Zone besteht aus Ziffern, Komma und der Tilde."
