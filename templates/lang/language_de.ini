[LOX]
EINLEITUNG = "Die Sprachsteuerung sagt Loxone, WAS gemeint war. Was daraus wird, entscheidet der Miniserver - so bleibt die Logik dort, wo sie hingehört."
H_TITEL = "Einbindung in Loxone, Schritt für Schritt"
K_TOKEN_NEU = "Neues Token erzeugen"
K_VORLAGE = "Vorlage für Loxone Config herunterladen"
S1_TEXT = "In <i>System → MQTT Gateway</i> unter <i>Subscriptions</i> eintragen und speichern:"
S1_TITEL = "Schritt 1: Abo im MQTT-Gateway eintragen"
S1_WARNUNG = "<b>Ohne diesen Eintrag kommt am Miniserver nichts an.</b> Das ist die häufigste Fehlerursache überhaupt."
S2_EMPFEHLUNG = "<b>Der bequemste Weg</b> ist die letzte Zeile: je Ziel ein eigenes Thema. Ein virtueller Eingang hängt dann genau an <span class='sm-mono'>wohnzimmer/licht/aktion</span> und braucht keine Fallunterscheidung im Miniserver. Die allgemeinen Themen sind für Fälle, in denen Loxone selbst entscheiden soll."
S2_TEXT = "Bei jedem verstandenen Satz sendet der Dienst:"
S2_TITEL = "Schritt 2: Was veröffentlicht wird"
S3_TEXT = "Ein virtueller HTTP-Eingang, der den Zustand holt. Wichtig ist vor allem <span class='sm-mono'>BEREIT</span>: es sagt, wie viele Mikrofone gerade wirklich verbunden sind. Ein Mikrofon, das seit Tagen nicht antwortet, fällt sonst niemandem auf - bis man davor steht und redet."
S3_TITEL = "Schritt 3: Zustand der Anlage überwachen"
S4_ANSAGE = "<b>Das ist mehr wert, als es klingt.</b> Eine Ansage 'Das Garagentor steht seit einer Stunde offen' im richtigen Raum erreicht mehr als jede Meldung auf einem Bildschirm, den niemand ansieht. Und der Satzweg macht die Sprachlogik auch für Taster nutzbar."
S4_TEXT = "Es geht auch andersherum: Loxone kann die Anlage etwas sagen lassen oder ihr einen Satz unterschieben, als hätte ihn jemand gesprochen. Ein <i>Virtueller Ausgang</i> mit der Adresse des LoxBerry genügt."
S4_TITEL = "Schritt 4: Loxone spricht"
S5_TEXT = "Der Endpunkt liegt im unangemeldeten Bereich, damit Loxone ihn ohne Zugangsdaten erreicht, und ist deshalb durch ein Token geschützt. Ein neues Token macht alle bereits eingetragenen Adressen ungültig."
S5_TITEL = "Schritt 5: Das Token"
S6_ERLAEUTERUNG = "<b>Zu #3 und #4:</b> Diese beiden sind virtuelle Eingänge für TEXT, keine Zahlen. In Loxone Config ist das der Haken 'Als Text verwenden' - ohne ihn kommt bei <span class='sm-mono'>ein</span> eine 0 an.<br><b>Zu #7 und #8:</b> Erst die UND-Verknüpfung mit dem Ziel macht den Befehl eindeutig. Ohne sie schaltet 'Licht aus' in der Küche auch das Wohnzimmer.<br><b>Zu #10:</b> Die Schwelle liegt bewusst hoch. Wer eine halbe Stunde nichts sagt, hat keine Störung - er hat nur nichts gesagt. Gemeint ist das ALTER des Abbilds, nicht die Zeit seit dem letzten Satz.<br><b>Zu #12 und #14:</b> Der Benachrichtigungs-Baustein sendet nur beim Wechsel von Aus auf Ein. Niemals mehrere Quellen direkt an seinen Eingang legen, sondern erst über ein ODER zusammenführen.<br><b>Zu #15:</b> Der Rückweg. Damit sagt die Anlage von sich aus Bescheid."
S6_TEXT = "Nachgebaut wird: ein gesprochener Befehl schaltet eine Lichtgruppe, und der Ausfall der Sprachkette wird gemeldet. Loxone Config führt alle Bausteine in der Baustein-Suche (F5)."
S6_TITEL = "Schritt 6: Komplette Baustein-Liste zum 1:1-Nachbauen"
S7_TEXT = "Diese drei Adressen im Browser aufrufen. Werte, 403, 400 - dann trägt die Einrichtung."
S7_TITEL = "Schritt 7: Gegenprobe"
