ABO_UNGEMESSEN = "<b>Nicht gemessen:</b> ob das Gateway die Werte behält (retain) und ob ein anderer Teilnehmer am Broker sie mitlesen kann. Das Plugin sendet über den UDP-Eingang des Gateways und abonniert selbst nichts; was der Broker daraus macht, ist hier nicht geprüft worden."
