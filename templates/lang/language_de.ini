[LOXIMP]
ERKLAERUNG = "Der Miniserver kennt Ihre Geräteliste bereits - jeden Baustein mit Raum und Anzeigenamen. Statt sie abzutippen, lässt sie sich einmal holen und dann anhaken. <b>Drei Dinge dazu:</b> Es bleibt ein <i>Vorschlag</i> - übernommen wird nur, was Sie anhaken. Die Zugangsdaten werden <b>einmal benutzt und nicht gespeichert</b>; abgelegt wird nur die Vorschlagsliste, und darin stehen Namen, keine Kennwörter. Und die Satzmuster bleiben unberührt - es kommen nur Ziele dazu."
