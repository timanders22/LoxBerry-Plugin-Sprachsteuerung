H_ANSAGE_ABSTAND_S = "Mindestabstand zwischen zwei Ansagen. Ein Loxone-Baustein, der in einer Schleife hängt, erzeugt sonst beliebig viele hintereinander. 0 schaltet die Bremse ab."
H_ANSAGE_JE_TAG = "Höchstzahl der Ansagen in 24 Stunden. 0 heißt: unbegrenzt."
H_ANTWORTWEG = "Antwort zurück nach Loxone"
H_ANTWORTWEG_FELD = "Der Text im Thema <span class='sm-mono'>/antwort</span> geht in jedem Fall an Loxone - diese Auswahl betrifft nur die gesprochene Ansage."
H_ANTWORTWEG_TEXT = "Piper spricht die Antwort in den Lautsprecher des Mikrofons, das die Frage gehört hat. Wer im Nebenzimmer steht, hört nichts. Hier wird eingestellt, dass der fertige Satz zusätzlich nach Loxone geht: als Text im MQTT-Thema <span class='sm-mono'>/antwort</span> für einen virtuellen Texteingang, und als Ansage über Music Server oder Audioserver. Die Felder sind dieselben wie im Abfuhrkalender und im Abfahrtsassistenten."
H_BESTAETIGUNG_S = "Wie lange die Anlage auf ein 'ja' wartet, nachdem sie bei einem heiklen Ziel zurückgefragt hat. 0 schaltet die Rückfrage ab - dann wird sofort geschaltet."
H_CC_PRAEFIX = "Die Einstellung <i>MQTT-Thema</i> in Chromecast4lox, ab Werk <span class='sm-mono'>chromecast4lox</span>. Die Ansage geht an <span class='sm-mono'>&lt;präfix&gt;/&lt;lautsprecher&gt;/cmd/tts</span> (QoS 1, nicht zurückbehalten). Ob Chromecast4lox da ist, sagt <span class='sm-mono'>&lt;präfix&gt;/server/online</span>."
H_CC_ZIEL = "Name des Lautsprechers wie in Chromecast4lox (Umlaute und Leerzeichen werden wie dort umgeschrieben) oder <span class='sm-mono'>alle</span> für jeden Lautsprecher. Die Lautstärke der Ansage stellt Chromecast4lox ein (Ansagelautstärke)."
H_DIENST = "Sprachdienst"
H_DIENSTE = "Wo die Sprachdienste laufen"
H_GOOGLE = "Google-Lautsprecher (Chromecast 4 Lox NG)"
H_GOOGLE_GERAET = "Leer: das Standardgerät von Chromecast 4 Lox NG. Sonst ein Name aus dessen Geräteliste, genau wie dort geschrieben (z. B. <span class='sm-mono'>Küche Box</span>), mehrere durch Komma getrennt, <span class='sm-mono'>gruppe:&lt;Name&gt;</span> oder <span class='sm-mono'>alle</span>. Einen unbekannten Namen weist Chromecast 4 Lox NG ab - nie wird daraus <i>alle</i>."
H_GOOGLE_LAUT = "Leer: die Ansagelautstärke von Chromecast 4 Lox NG. Sonst gilt der Wert nur für diese Ansage, gedeckelt durch dessen Lautstärke-Obergrenze und Ruhezeit; danach stellt es die vorige Lautstärke wieder her."
H_GOOGLE_TEXT = "Nur für die Art der Audioausgabe <b>Google-Lautsprecher (Chromecast 4 Lox NG)</b>. Die Ansage geht per POST an den Sprech-Endpunkt des Chromecast-Plugins auf diesem LoxBerry (<span class='sm-mono'>127.0.0.1/plugins/chromecast-4lox-ng/index.php</span>, ab dessen Fassung 1.3.15). Dort einrichten: Reiter <i>Einstellungen</i>, Abschnitt <i>Sprachausgabe für andere Plugins</i> - Haken setzen, Sprechtoken festlegen, wahlweise ein Standardgerät. Ruhezeit, Lautstärke-Obergrenze und Gong des Chromecast-Plugins gelten auch hier. Anders als <i>Chromecast4lox (über MQTT)</i> braucht dieser Weg keinen Broker. Nimmt das Chromecast-Plugin die Ansage nicht an, sprechen wie bisher die Lautsprecher der Sprachgeräte; auf einen anderen Google-Lautsprecher wird nie ausgewichen. Der Reiter Test sagt, was gilt."
H_GOOGLE_TOKEN = "Das Sprechtoken aus Chromecast 4 Lox NG (Reiter <i>Einstellungen</i>, Abschnitt <i>Sprachausgabe für andere Plugins</i>) - ein anderes als das von Alexa-NG. Es wird wie ein Kennwort behandelt: nie angezeigt, nicht in der Sicherung, nie in einer Adresse (der Aufruf geht per POST an <span class='sm-mono'>127.0.0.1</span>). Leer lassen behält das gespeicherte."
H_KONTEXT_S = "Wie lange ein genanntes Ziel für Folgesätze gilt. Damit wird aus einer Befehlsliste ein Gespräch: 'Licht im Wohnzimmer an' - 'heller' - 'aus'. 0 schaltet den Kontext ab."
H_LLM_EIN = "Nur was kein Satzmuster trifft, geht an das Modell. Ist es abgeschaltet, antwortet die Anlage auf Unbekanntes mit 'Das habe ich nicht verstanden' - ehrlicher als eine geratene Handlung."
H_LOXONE = "Weg nach Loxone"
H_PROBE = "Erzeugt eine WAV-Datei mit der oben eingetragenen Stimme über die gespeicherte Piper-Adresse, ohne einen Container anzulegen. So lässt sich hören, wie eine Stimme klingt, bevor man sie einrichtet. Piper muss dafür laufen."
H_RUHE = "Ruhezeit und Wiederholungsbremse"
H_RUHE_TEXT = "<b>Ohne Ruhezeit kann jeder Loxone-Baustein um drei Uhr nachts das Haus reden lassen.</b> Das Ansageverfahren dieses Plugins stammt aus dem Abfuhrkalender - die Wache davor gab es dort seit jeher, hier bis 0.9.11 nicht. Innerhalb der Ruhezeit bleibt auch der Lautsprecher des Mikrofons still. Ein Alarm kann sie übergehen: dafür trägt der virtuelle Ausgang <span class='sm-mono'>&amp;dringend=1</span>."
H_TTS_MODE = "<b>aus</b> (ab Werk): es sprechen nur die Lautsprecher der Sprachgeräte. <b>Music Server</b> ist der Regelfall für Loxone. <b>MusicServer4Home</b> und <b>eigene Vorlage</b> benutzen das Vorlagenfeld unten. Beim <b>originalen Loxone Audioserver</b> gibt es keinen Aufruf über das Netz - dort wird die Ansage in Loxone Config gebaut (Textgenerator am TTS-Eingang), und das Plugin liefert den Text im MQTT-Thema <span class='sm-mono'>/ansage</span>. <b>Chromecast4lox</b> (über MQTT), <b>Alexa-NG</b> und <b>Google-Lautsprecher (Chromecast 4 Lox NG)</b> (über dessen Sprech-Endpunkt) sind Plugins auf diesem LoxBerry (Felder weiter unten). Alexa selbst ist nicht eingebaut: dafür gibt es keine offizielle lokale Schnittstelle."
H_TTS_STIMME = "Wahlweise eine andere Piper-Stimme für die Ansagen als die, mit der der Container gestartet wurde. Bleibt das Feld leer, gilt die des Containers."
H_TTS_TEMPLATE = "Nur für MusicServer4Home und eigene Vorlage. Ersetzt werden <span class='sm-mono'>{ip}</span>, <span class='sm-mono'>{port}</span>, <span class='sm-mono'>{zones}</span>, <span class='sm-mono'>{vol}</span>, <span class='sm-mono'>{lang}</span> und <span class='sm-mono'>{text}</span>. Bleibt das Feld leer, gilt die Standardvorlage von MusicServer4Home."
H_TTS_ZONES = "Eine oder mehrere Zonen, durch Komma getrennt: <span class='sm-mono'>2,4</span>. Eine eigene Lautstärke je Zone geht mit der Tilde: <span class='sm-mono'>2~15,4</span> - sie hat Vorrang vor dem Feld darunter. Ein Mikrofon kann eine eigene Zone tragen; dann kommt die Antwort in dem Raum an, in dem gefragt wurde."
H_URL = "Wahlweise. Der Regelweg ist MQTT - dafür braucht das Plugin keine Zugangsdaten des Miniservers. Wer den unmittelbaren Aufruf will, trägt hier eine Adresse ein; <span class='sm-mono'>{ziel}</span>, <span class='sm-mono'>{aktion}</span> und <span class='sm-mono'>{wert}</span> werden ersetzt. <b>Zugangsdaten werden hier maskiert angezeigt</b> - wer sie ändern will, trägt die ganze Adresse neu ein."
H_VERSTEHEN = "Wie verstanden wird"
H_WAKEWORD = "Das Weckwort muss der Wortwecker kennen. Welche er wirklich geladen hat, sagt der Knopf <i>Dienste befragen</i> im Reiter Test - was das Modell nicht kennt, weckt nicht."
H_WARTEZEIT = "Wie lange die Oberfläche und der Miniserver auf die Antwort des Dienstes warten. Mehr als 12 Sekunden nimmt ein Webserver ohnehin nicht an; der Dienst arbeitet den Befehl trotzdem zu Ende."
H_ZUSATZ = "Chromecast4lox und Alexa-NG"
H_ZUSATZ_TEXT = "Nur für die Art der Audioausgabe <b>Chromecast4lox</b> bzw. <b>Alexa-NG</b>. Das jeweilige Plugin muss auf diesem LoxBerry laufen. Nimmt es die Ansage nicht an (Plugin fehlt, Lautsprecher unbekannt, keine Rückmeldung binnen 10 s), sprechen wie bisher die Lautsprecher der Sprachgeräte - auch beim Antwortweg <i>nur Loxone</i>. Der Reiter Test sagt, was gilt."
