UNGEPRUEFT = "Ob ein Mikrofon Audio liefert, das Whisper versteht; ob das Weckwort in Ihrem Raum zuverlässig anspricht; ob ESPHome-Mikrofone den Audioweg tragen - das lässt sich nur mit echter Hardware feststellen. Das Plugin wurde ohne gebaut; geprüft wurde die ganze Kette gegen Attrappen, die das Originalpaket des Wyoming-Protokolls benutzen. Was danach kommt - Raumakustik, Nachhall, Nebengeräusche - entscheidet sich erst bei Ihnen. Ebenfalls ungemessen: ob das MQTT-Gateway die Werte behält (retain), und ob ein anderer Teilnehmer am Broker mithören kann. Und: fünf Netzabrufe des Dienstes sind synchron; ein einzelner Satz kann die Verarbeitung rechnerisch bis zu rund 161 Sekunden anhalten, in denen kein anderes Mikrofon bedient wird - am Gerät nachzumessen an der Lücke zwischen zwei Herzschlägen."
