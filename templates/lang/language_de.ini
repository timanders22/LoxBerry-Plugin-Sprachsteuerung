H_ALEXA_GERAET = "Ein oder mehrere Geräte (durch Komma getrennt), <span class='sm-mono'>gruppe:&lt;name&gt;</span> oder <span class='sm-mono'>alle</span> - so, wie Alexa-NG sie nennt. Leer: das Standardgerät aus Alexa-NG."
