RETAIN_ERKLAERUNG = "<b>Zurückbehalten</b> heißt: der Broker hebt den letzten Wert auf und gibt ihn jedem neuen Abonnenten sofort. Nach einem Neustart des Miniservers oder des Gateways steht der Zustand damit sofort wieder da, ohne auf den nächsten Herzschlag zu warten. Zustände werden zurückbehalten, Messwerte mit Zeitbezug nicht - sonst sähe ein Wert von gestern wie einer von jetzt aus. Das Lebenszeichen (<span class='sm-mono'>online</span>, <span class='sm-mono'>ts</span>) wird nie zurückbehalten: es stünde für immer auf 'lebt'. Ebenso nie zurückbehalten werden Aussagen des Dienstes über sich selbst - das Ergebnis des letzten Satzes (<span class='sm-mono'>ok</span>, <span class='sm-mono'>grund</span>, <span class='sm-mono'>antwort</span>) und seine Verbindungen (<span class='sm-mono'>bereit</span>, <span class='sm-mono'>dienste_ok</span>) - und <span class='sm-mono'>ruhe</span>, weil die Ruhezeit allein mit der Uhr wechselt. Die Befehle an die Ziele (<span class='sm-mono'>thema/aktion</span>, <span class='sm-mono'>thema/wert</span>) gehen ebenfalls flüchtig: nach einem Neustart von Broker oder Gateway sollen sie nicht noch einmal ankommen. Seit 0.11.10; der alte Wert wird gelöscht, bis der Broker bestätigt, dass keiner mehr dasteht."
RETAIN_GEMESSEN = "<b>Am Gerät gemessen (13.09.2026):</b> der UDP-Eingang des Gateways nimmt das Befehlswort <span class='sm-mono'>retain</span> an; die so gesendeten Themen lagen danach zurückbehalten im Broker, die mit <span class='sm-mono'>publish</span> gesendeten nicht. Bis 0.11.4 ging alles flüchtig hinaus. Im Haus läuft Gateway <b>Version 1</b>. Ein leerer Wert geht immer flüchtig - eine leere Nutzlast löscht ein zurückbehaltenes Thema."
THEMEN_ERKLAERUNG = "Bei jedem verstandenen Satz und - falls der Herzschlag eingeschaltet ist - regelmäßig auch ohne Anlass."
