L_ENDPUNKT_EIN = "Accept the HTTP endpoint for Loxone"
MUSTERPROJEKT = "The complete project file with all plugin pages and templates: <a href='https://github.com/timanders22/LoxBerry-Plugins-Musterprojekt' target='_blank' rel='noopener'>LoxBerry plugins sample project</a>"
S1_TEXT = "Everything about MQTT is on the <i>MQTT</i> tab: leave “MQTT” and the heartbeat (60 s) on (both on by default), the gateway state and the complete topic list. With MQTT gateway version 1 the plugin writes the subscription file itself; with version 2 tick the topics of the name table (step 2) in the subscriptions, “Noncached” where stated. After a Miniserver restart the central “reconnect” on the page “LoxBerry MQTT-Gateway” fetches the retained values. For the commands (step 4) set the ticks “Accept commands via MQTT” and “Allow announcements and sentences via MQTT” there."
S1_TITEL = "Step 1: set up MQTT"
S3_TEXT = "The state of the system arrives with the heartbeat every minute via the MQTT gateway: one <i>Virtual Input</i> per value, named by the gateway (table). Most important are <span class='sm-mono'>bereit</span> - how many microphones are really connected right now - and <span class='sm-mono'>dienste_ok</span>: otherwise a dead Whisper container looks just like a healthy system. If the service hangs or the LoxBerry stops, no heartbeat arrives; the sign of life <span class='sm-mono'>status/zaehler</span> gives it away (since 0.12.7)."
S3_TITEL = "Step 2: monitor the system state"
S4_ANSAGE = "<b>This is worth more than it sounds.</b> An announcement 'the garage door has been open for an hour' in the right room achieves more than any message on a screen nobody looks at. And the sentence path makes the voice logic usable from push buttons too."
S4_TEXT = "It also works the other way round: Loxone can make the system say something, pass it a sentence as if someone had spoken it, or mute the announcements - via MQTT to the plugin's command bridge. A <i>Virtual Output</i> to the UDP input of the MQTT gateway is enough - or the ready-made template (button below)."
S4_TITEL = "Step 4: Loxone speaks"
S5_TEXT = "The endpoint lives in the unauthenticated area so Loxone can reach it without credentials, and is therefore protected by a token. With <span class='sm-mono'>?selftest=1</span> you can check whether it is still correct <b>without anything happening</b> - the alternative would be to make the house talk. A new token invalidates all addresses already entered."
S5_TITEL = "The token"
S7_TEXT = "Call these addresses in a browser. The first one says whether the token is correct without anything happening."
S7_TITEL = "Cross-check"
SB_KEINE_ZIELE = "No target is configured yet (Sentences tab) – the names are formed from the topic of the target."
SB_TEXT = "An understood command reaches Loxone via the MQTT gateway: per target a <i>Virtual Text Input</i> for the action (<span class='sm-mono'>ein</span>, <span class='sm-mono'>aus</span>, <span class='sm-mono'>wert</span>) and a <i>Virtual Input</i> for the number. The gateway assigns the names itself – prefix and topic with “_” instead of “/”. The table lists them for every configured target; since 0.12.5 the action returns to “-” 2 seconds after each command."
SB_TITEL = "Step 3: voice commands in Loxone"
SB_UDP = "The template “one input per target” only works if the gateway sends via UDP – in the house it runs via HTTP, where it would never get a value (not tested). Without the gateway, with access to the Miniserver, the direct call per target also works (column “Address (own Miniserver)” of the targets in the Sentences tab)."
