EIGENER_WERT = "custom value (field below)"
EIGENER_WERT_H = "or enter a custom value here"
EIGENSCHAFT = "Property"
EIN = "on"
GESTOPPT = "stopped"
HINWEIS = "For information:"
JA = "yes"
KACHEL_MQTT_HILFE = "Publishing by this plugin; gateway autostart: %s"
KEINE_PID = "no process id"
LAEUFT = "running"
MIKROFONE = "Microphones"
NEIN = "no"
NICHT_FESTSTELLBAR = "not determinable"
RUHE = "Announcements"
RUHE_AUS = "no quiet hours configured"
