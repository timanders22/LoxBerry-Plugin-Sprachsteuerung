A_DIAG = "plain-text findings with next steps"
EINLEITUNG = "The voice control tells Loxone WHAT was meant. What comes of it is decided by the Miniserver - so the logic stays where it belongs."
H_TITEL = "Loxone integration, step by step"
IMPORT_WARNUNG = "<b>Loxone Config creates new objects on import and overwrites nothing.</b> Importing twice means duplicate objects. And the address in the file header is a <b>suggestion</b>: it comes from the name you used to open this page, which need not be the one the Miniserver uses to reach the LoxBerry. Check it after importing."
