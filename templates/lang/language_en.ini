UNGEPRUEFT = "Whether a microphone delivers audio Whisper understands; whether the wake word reliably triggers in your room; whether ESPHome microphones carry the audio path - only real hardware can establish that. The plugin was built without any; the whole chain was tested against stubs using the original Wyoming protocol package. What comes after - room acoustics, reverberation, background noise - is decided at your place. Whether the MQTT gateway retains the values was measured on 13.09.2026 with gateway V1 (MQTT tab). Sentences are processed one after another; one sentence can make the next wait for up to roughly 33 s (from the time limits, unmeasured on the device) - the microphones keep being served meanwhile."
