[LOX]
EINLEITUNG = "The voice control tells Loxone WHAT was meant. What becomes of it is decided by the Miniserver - that way the logic stays where it belongs."
H_TITEL = "Loxone integration, step by step"
K_TOKEN_NEU = "Generate new token"
K_VORLAGE = "Download template for Loxone Config"
S1_TEXT = "Enter under <i>Subscriptions</i> in <i>System &rarr; MQTT Gateway</i> and save:"
S1_TITEL = "Step 1: enter the subscription in the MQTT gateway"
S1_WARNUNG = "<b>Without this entry nothing arrives at the Miniserver.</b> This is the single most common cause of failure."
S2_EMPFEHLUNG = "<b>The most convenient route</b> is the last row: one topic per target. A virtual input then hangs on exactly <span class='sm-mono'>wohnzimmer/licht/aktion</span> and needs no case distinction in the Miniserver. The general topics are for cases where Loxone itself should decide."
S2_TEXT = "On every understood sentence the service sends:"
S2_TITEL = "Step 2: what gets published"
S3_TEXT = "A virtual HTTP input that fetches the state. What matters most is <span class='sm-mono'>BEREIT</span>: it says how many microphones are actually connected. A microphone that has not answered for days otherwise goes unnoticed - until you stand in front of it and talk."
S3_TITEL = "Step 3: monitoring the state of the system"
S4_ANSAGE = "<b>That is worth more than it sounds.</b> An announcement 'The garage door has been open for an hour' in the right room achieves more than any message on a screen nobody looks at. And the sentence route makes the voice logic usable for push-buttons too."
S4_TEXT = "It works the other way too: Loxone can have the system say something, or slip it a sentence as if someone had spoken it. A <i>Virtual output</i> with the address of the LoxBerry is enough."
S4_TITEL = "Step 4: Loxone speaks"
S5_TEXT = "The endpoint sits in the unauthenticated area so Loxone can reach it without credentials, and is therefore protected by a token. A new token invalidates every address already entered."
S5_TITEL = "Step 5: the token"
S6_ERLAEUTERUNG = "<b>On #3 and #4:</b> these two are virtual inputs for TEXT, not numbers. In Loxone Config that is the 'use as text' checkbox - without it, <span class='sm-mono'>ein</span> arrives as 0.<br><b>On #7 and #8:</b> only the AND with the target makes the command unambiguous. Without it, 'lights off' in the kitchen also switches the living room.<br><b>On #10:</b> the threshold is deliberately high. Someone who says nothing for half an hour has no fault - they simply said nothing. What is meant is the AGE of the snapshot, not the time since the last sentence.<br><b>On #12 and #14:</b> the notification block only fires on a change from off to on. Never wire several sources directly to its input, merge them through an OR first.<br><b>On #15:</b> the way back. With it the system speaks up by itself."
S6_TEXT = "What is rebuilt: a spoken command switches a light group, and the failure of the voice chain is reported. Loxone Config lists all blocks in the block search (F5)."
S6_TITEL = "Step 6: complete block list to rebuild one to one"
S7_TEXT = "Open these three addresses in a browser. Values, 403, 400 - then the setup holds."
S7_TITEL = "Step 7: cross-check"
TOKEN_NEU = "A new token has been generated. <b>The addresses in Loxone have to be adjusted.</b>"
