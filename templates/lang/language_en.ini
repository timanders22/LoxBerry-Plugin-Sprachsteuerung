[MIKRO]
ANTWORTET = "responding"
ERKLAERUNG = "Two families, both entirely local:<br><b>Wyoming</b> - any Linux machine with a microphone running <span class='sm-mono'>wyoming-satellite</span>. A Raspberry Pi Zero 2 W with a USB microphone costs under 30 euros and is entirely sufficient.<br><b>ESPHome</b> - the ready-made small devices: M5Stack Atom Echo, Home Assistant Voice Preview Edition, ESP32-S3-BOX. They need the noise key from their ESPHome setup."
ESPHOME_WARNUNG = "<b>An honest assessment:</b> until 0.9.11 this path did not exist - the device connected and then nothing happened. From 0.10.0 to 0.10.2 the callbacks were registered but unusable: the library requires coroutines, these were plain functions, and one took an argument too few. No audio ever arrived, and not a single event went back - the device believed it was permanently mid-request. Since 0.11.0 the path is built and measured against the original aioesphomeapi package, and since 0.11.1 against the ESPHome <b>firmware</b> itself: it reads specific values out of each event and bails out on an empty one - without text in TTS_START it never starts the speaker, without a url in TTS_END it never enters the state in which the buffer is drained. The audio is also paced, because its speaker buffer holds only half a second. <b>It is still not measured on a device</b> - there is none here. A fault there does not drag the Wyoming microphones down; each runs on its own."
