[BAUSTEIN]
SEITE1_H1 = "<b>On no. 12:</b> if the service hangs or the LoxBerry stops, no heartbeat arrives – the other inputs keep their last value, only the sign of life stands still. If no new value arrives within Tmc (180 s), the value validator reports at its output E. sprachsteuerung_status_zaehler to V, the constant 1 to En – and remove the tick at ‘En’ in the properties window."
SEITE1_H2 = "<b>On nos. 13 to 19:</b> “service stopped”, “voice service missing” and “sign of life missing” run through two ORs into one notification – a notification block only gets one source. The message only comes after 10 minutes of fault (a restart or an update stays silent); “LoxBerry off” after 13 minutes at the earliest (3 minutes sign of life and 10 minutes)."
SEITE1_H3 = "<b>On nos. 15 and 22:</b> a threshold switch behind an input that arrives anew every minute gives short pulses; the on-delay behind it (no. 18 or 23) swallows them."
SEITE1_H4 = "<b>On nos. 1, 3, 4, 7 and 8:</b> these values arrive every minute, often with the same value; with gateway version 2 therefore set “Noncached” – otherwise an input stays at 0 after a Miniserver restart (e.g. “service stopped”). The others are retained or always change."
SEITE1_H5 = "Another prefix on the MQTT tab gives other names – then rename all inputs. The LoxBerry user in the Miniserver needs the right to write virtual inputs."
SEITE1_H6 = "Up to 0.12.6 a Virtual HTTP Input “Sprachsteuerung lokal” fetched these values with the token; that path is below under “Existing setups” and since 0.12.7 needs the tick “Accept the HTTP endpoint for Loxone”. ALTER does not exist via MQTT – the sign of life also covers a hanging service."
SEITE1_SCHRITT1 = "In the plugin, start the service on the “Settings” tab, start Whisper and Piper on the “Services” tab, enter the microphones on the “Microphones” tab. On the “MQTT” tab leave “MQTT” and the heartbeat (60 s) on (on by default). Check: the self-test on the “Test” tab is green."
SEITE1_SCHRITT2 = "With MQTT gateway version 2 tick the ten topics of nos. 1–10 in the subscriptions, for online, bereit, dienste_ok, ruhe and letzter_satz_alter additionally “Noncached” (name table above). Version 1 reads the subscription file the plugin writes itself."
SEITE1_SCHRITT3 = "Create the page “Sprachsteuerung”. Create the ten inputs nos. 1–10 BY HAND (select Virtual Inputs → Virtual Input), name EXACTLY as in the table – that is what they are called at the gateway; do not tick “Use as digital input”. Add the constant “Konstante 1” (no. 11, value 1; already present in the sample project)."
SEITE1_SCHRITT4 = "Create two notifications (Periphery → Messages → Notification): “Meldung Plugin gestört (Sprachsteuerung)” and “Meldung Mikrofon getrennt (Sprachsteuerung)”, text from the table, drag them onto the page."
SEITE1_SCHRITT5 = "Place the remaining blocks via the block search (F5), parameters as in the table, wire from top to bottom; ORs have two inputs each. Value validator no. 12: remove the tick at ‘En’ in the properties window (Config creates En negated; otherwise the constant 1 arrives as 0 and the failure message never triggers). Status no. 20: press “+” four times first (V5–V8). Status rows and message texts are in the table and entered by hand, the row without condition last."
SEITE1_SCHRITT6 = "Save and transfer to the Miniserver. Check: “Zustand (Sprachsteuerung)” shows “läuft – … Mikrofonen verbunden”, and sprachsteuerung_status_zaehler counts up by one every minute. Cross-check: stop the service in the plugin – “Zustand” shows “Sprachdienst gestoppt”, after 10 minutes “Meldung Plugin gestört (Sprachsteuerung)” arrives."
SEITE2_H1 = "<b>On no. 1 to 13:</b> name exactly as the gateway assigns it (prefix from the MQTT tab); a prettified name creates a second input. The names of all configured targets are listed above in this step."
SEITE2_H2 = "<b>On no. 1:</b> since 0.12.5 the plugin resets the command to “-” 2 seconds after each sentence. So the same command also works twice in a row (“light on”, switched off by hand in between) – the gateway only sends changes, and Loxone would otherwise not see the same text as new."
SEITE2_H3 = "<b>On no. 3 and 4:</b> the status block compares the text (== “ein”); its status value comes out at output AQ."
SEITE2_H4 = "<b>On no. 6:</b> at “Off” of a lighting controller only pulses shorter than 200 ms – a longer one locks the block, hence Pd 0.1 s."
SEITE2_H5 = "<b>On no. 2 and 7:</b> the same number twice (“dimme auf 40”) does not change the input – the dimmer gets nothing new."
SEITE2_H6 = "For every further target the same rows with its topic (factory targets: kueche/licht, alle/licht, wohnzimmer/heizung). After a restart of the gateway or the Miniserver the command inputs are empty; that is intended – nothing is switched again."
SEITE2_H7 = "If you switch the gateway to UDP, you can use the template “one input per target” instead of the text inputs – not tested in the house."
SEITE2_SCHRITT1 = "Check on the plugin's “MQTT” tab: the gateway is on autostart; with gateway version 2 tick the data points of the name table (step 2). On the “Sentences” tab the targets have a topic (factory target “Licht im Wohnzimmer” = wohnzimmer/licht)."
SEITE2_SCHRITT2 = "In Loxone Config create the inputs of the table BY HAND (select Virtual Inputs → Virtual Text Input or Virtual Input), name EXACTLY as in the table – this is what the gateway calls them: prefix and topic with “_” instead of “/”. Texts (no. 1, 9–13) as “Virtual Text Input”, numbers (no. 2, 7, 8) as “Virtual Input”, display names as in the table. A prettified name creates a second input with the first sentence, and the block of the table stays empty."
SEITE2_SCHRITT3 = "Create the page “Sprachsteuerung Befehle”, drag the inputs, place the status blocks and edge detections with the block search (F5). At the two edge detections no. 5 and 6 set Pd to 0.1 s (Config creates 1 s). Status “Letzter Sprachbefehl (Sprachsteuerung)” no. 14: click “+” twice first (V5, V6)."
SEITE2_SCHRITT4 = "Connect the outputs On of no. 5 and 6 to your own lighting or switching block (on and off), no. 2 to your own dimmer, no. 7 to your own setpoint."
SEITE2_SCHRITT5 = "Save and send. Check: say “schalte das licht im wohnzimmer an” (or type it in the plugin tab “Test”) – “Letzter Sprachbefehl (Sprachsteuerung)” shows “ausgeführt …” (executed), and the edge detection no. 5 gives a short pulse."
SEITE3_H1 = "You change the text of an announcement in the command after <span class='sm-mono'>sprechen </span> (spaces stay spaces); at most 400 characters; for now without umlauts (ae, oe, ue, ss) until it has been measured how Loxone sends them via UDP. Only in one zone or on one speaker: JSON instead of text (no. 8)."
SEITE3_H2 = "An announcement only works if the voice service is running – otherwise the plugin acknowledges “abgelehnt: DIENST_LAEUFT_NICHT”, it is not made up later. The same text within 10 seconds is accepted only once (command bridge brake); after that the plugin's repetition brake applies (Settings tab)."
SEITE3_H3 = "<b>On no. 10:</b> “alarm” overrides any quiet – also at night and when muted; only use it for real alarms."
SEITE3_H4 = "<b>On nos. 13 to 18:</b> Loxone mutes via the command “Sprachsteuerung: Ansagen stilllegen” – this also applies to announcements other plugins make via the voice control. Muting from Loxone survives a plugin update (since 0.12.6)."
SEITE3_H5 = "<b>On no. 19 and 20:</b> without “Permanent connection to the broker” (MQTT tab) no. 19 stays at 0 – do not hang a message on it."
SEITE3_H6 = "<b>On no. 2:</b> choose only one path for the doorbell in your own house – either the bell messages in the Intercom plugin or these blocks."
SEITE3_H7 = "How and where announcements are spoken is set in the plugin (shared voice module); Loxone only triggers. Only with “Original Loxone Audioserver” does the plugin deliver the text for the TTS input (no. 21)."
SEITE3_H8 = "Anyone on the home network can send commands via the UDP input of the MQTT gateway – that is why both ticks are off by default. Up to 0.12.6 the commands went via HTTP with token (template “Sprachsteuerung lokal - Befehle”); that path is below under “Existing setups”."
SEITE3_SCHRITT1 = "In the plugin tab “Settings” choose the output (factory setting “off”: only the loudspeakers of the voice devices speak; otherwise e.g. Music Server, Chromecast, Alexa-NG, Sonos or Audioserver via the shared voice module). Leave the quiet hours in the plugin switched off if Loxone mutes (no. 18)."
SEITE3_SCHRITT2 = "In step 4 of this tab, button “Template: MQTT commands”. In Loxone Config: select Virtual Outputs → Predefined devices → import template (only once). The container “Sprachsteuerung Befehle (MQTT)” carries five commands to the UDP input of the MQTT gateway. In the sample project they are on the shared output “LoxBerry MQTT-Gateway” – create the five commands with title and command from the table there."
SEITE3_SCHRITT3 = "Create the page “Sprachsteuerung Ansagen”. Drag the five commands, sprachsteuerung_ruhe (further instance), “Türklingel (eigene Quelle)” and “Niemand zu Hause (eigene Quelle)” (already present in the sample project); create the placeholders “Garagentor offen (eigene Quelle)” and “Wassermelder (eigene Quelle)”, the two buttons and the switch “Ansagen stilllegen (Sprachsteuerung)”; create inputs nos. 19, 20 and 21 by hand, name exactly like this."
SEITE3_SCHRITT4 = "Place the other blocks with the block search (F5) and connect them. At the schedule no. 13 enter ON daily 22:00–07:00, in all operating modes."
SEITE3_SCHRITT5 = "On the plugin's “MQTT” tab set the ticks “Accept commands via MQTT” and “Allow announcements and sentences via MQTT”. Save and transfer. Check: press “Taste Testansage (Sprachsteuerung)” – the system says “Das Garagentor steht seit einer Stunde offen”. Switch “Ansagen stilllegen (Sprachsteuerung)” on, press the button again: it stays silent, and “Ansagen (Sprachsteuerung)” shows “still – von Loxone stillgelegt”."
Z1_01 = "Virtual Input (name as the MQTT gateway assigns it, plugin Sprachsteuerung) | sprachsteuerung_online | 1 = the voice service is running (comes with the heartbeat every minute), 0 = stopped in an orderly way; MQTT gateway version 2: tick and “Noncached” | —"
Z1_02 = "Virtual Input (name as the MQTT gateway assigns it, plugin Sprachsteuerung) | sprachsteuerung_mikrofone | Number of configured microphones (retained) | —"
Z1_03 = "Virtual Input (name as the MQTT gateway assigns it, plugin Sprachsteuerung) | sprachsteuerung_bereit | Number of microphones connected right now; every minute; version 2: tick and “Noncached” | —"
Z1_04 = "Virtual Input (name as the MQTT gateway assigns it, plugin Sprachsteuerung) | sprachsteuerung_dienste_ok | Number of reachable voice services (Whisper, Piper and – if switched on in the plugin – language model); every minute; version 2: tick and “Noncached” | —"
Z1_05 = "Virtual Input (name as the MQTT gateway assigns it, plugin Sprachsteuerung) | sprachsteuerung_regeln | Number of loaded sentence patterns; 0 = the sentence file is missing (retained) | —"
Z1_06 = "Virtual Input (name as the MQTT gateway assigns it, plugin Sprachsteuerung) | sprachsteuerung_ziele | Number of configured targets (devices that can be switched by voice; retained) | —"
Z1_07 = "Virtual Input (name as the MQTT gateway assigns it, plugin Sprachsteuerung) | sprachsteuerung_ruhe | 1 = nothing is announced at the moment (quiet hours in the plugin or muted by Loxone); every minute; version 2: tick and “Noncached” | —"
Z1_08 = "Virtual Input (name as the MQTT gateway assigns it, plugin Sprachsteuerung) | sprachsteuerung_letzter_satz_alter | Seconds since the last understood sentence, as of the last heartbeat; -1 = none yet; version 2: tick and “Noncached” | —"
Z1_09 = "Virtual Input (name as the MQTT gateway assigns it, plugin Sprachsteuerung) | sprachsteuerung_status_zaehler | Sign of life: counts up by one with every heartbeat (every minute), 0 to 999, wraps around (never retained); only arrives with “MQTT” and heartbeat (plugin tab MQTT, on by default) | —"
Z1_10 = "Virtual Input (name as the MQTT gateway assigns it, plugin Sprachsteuerung) | sprachsteuerung_dienste_gesamt | Number of checked voice services (the denominator of no. 4; a switched-off language model does not count; retained) | —"
Z1_11 = "Constant | Konstante 1 | value 1 | —"
Z1_12 = "Value Validator | Lebenszeichen fehlt (Sprachsteuerung) | Tmc 180 s (three heartbeats without a new sign of life; a hanging service sends none either), Min 0, Max 999; remove the tick at ‘En’ in the properties window | V = #9, En = #11"
Z1_13 = "NOT | Keine frischen Daten (Sprachsteuerung) | — (voice service stopped) | I = #1"
Z1_14 = "Formula | Sprachdienste ausgefallen (Sprachsteuerung) | I1-I2 (checked minus reachable voice services; 0 = all answer) | I1 = #10, I2 = #4"
Z1_15 = "Threshold Switch | Sprachdienst fehlt (Sprachsteuerung) | On 0.5 / Off 0.25 (on from one failed service; a number, not a 0/1 field) | Input = #14"
Z1_16 = "OR | Dienst gestoppt oder Sprachdienst fehlt (Sprachsteuerung) | — (intermediate step of this line; the 600 s after it swallow the pulse of the threshold switch) | I1 = #13, I2 = #15"
Z1_17 = "OR | Störung (Sprachsteuerung) | — (service stopped, voice service missing or sign of life missing) | I1 = #16, I2 = output E of #12"
Z1_18 = "On-Delay | Störung bestätigt (Sprachsteuerung) | 600 s (ten heartbeats; a restart, an update and a late heartbeat report nothing) | Input = #17"
Z1_19 = "Notification | Meldung Plugin gestört (Sprachsteuerung) | Text: Sprachsteuerung – seit 10 Minuten läuft der Sprachdienst nicht, Whisper, Piper oder das Sprachmodell antworten nicht, oder vom Plugin kommt kein Lebenszeichen. Sprachbefehle und Ansagen gehen dann nicht. In der App den Status „Zustand (Sprachsteuerung)“ lesen (for 10 minutes the voice service has not been running, a voice service does not answer or no sign of life comes from the plugin) | Input = #18"
Z1_20 = "Status | Zustand (Sprachsteuerung) | Rows: V2 = 0 “Sprachdienst gestoppt – im Plugin Reiter Einstellungen ‚Dienst starten‘” (service stopped); V1 = 1 “Lebenszeichen fehlt seit mindestens 3 Minuten – LoxBerry oder Plugin antwortet nicht; LoxBerry im Browser öffnen, im Plugin Reiter MQTT ‚MQTT‘ und ‚Herzschlag‘ prüfen, unter MQTT-Gateway Fassung 2 die Haken” (sign of life missing); V3 = 0 “keine Satzmuster geladen – im Plugin Reiter Sätze eine Sicherung einspielen oder Muster eintragen” (no patterns); V7 = 0 “kein Sprachdienst erreichbar – im Plugin Reiter Dienste die Container starten” (no voice service); V8 > 0 “<v8> Sprachdienst(e) antworten nicht – im Plugin Reiter Dienste nachsehen” (services not answering); V4 = 0 “läuft – kein Mikrofon eingetragen; Sätze kommen nur über Loxone und den Reiter Test (im Plugin Reiter Mikrofone eines hinzufügen)” (no microphone); V6 > 0 “<v6> von <v4> Mikrofonen getrennt – Strom und WLAN prüfen, im Plugin Reiter Mikrofone nachsehen” (microphones disconnected); without condition “läuft – <v5> von <v4> Mikrofonen verbunden, <v7> Sprachdienste erreichbar” (running); visualisation ON | V1 = output E of #12, V2 = #1, V3 = #5, V4 = #2, V5 = #3, V6 = #21, V7 = #4, V8 = #14"
Z1_21 = "Formula | Mikrofone getrennt (Sprachsteuerung) | I1-I2 (configured minus connected microphones) | I1 = #2, I2 = #3"
Z1_22 = "Threshold Switch | Mikrofon getrennt (Sprachsteuerung) | On 0.5 / Off 0.25 (on from one disconnected microphone) | Input = #21"
Z1_23 = "On-Delay | Mikrofon seit einer Stunde getrennt (Sprachsteuerung) | 3600 s (a microphone restarting after a power cut or WLAN change reports nothing) | Input = #22"
Z1_24 = "Notification | Meldung Mikrofon getrennt (Sprachsteuerung) | Text: Sprachsteuerung – ein Mikrofon ist seit einer Stunde nicht verbunden; in diesem Raum hört niemand zu. Strom und WLAN des Geräts prüfen, im Plugin Reiter Mikrofone nachsehen; in der App den Status „Zustand (Sprachsteuerung)“ lesen (a microphone has been disconnected for an hour) | Input = #23"
Z1_25 = "Status | Sprachbetrieb (Sprachsteuerung) | Rows: V4 = 1 “kein Lebenszeichen seit 3 Minuten – hängt der Dienst? Im Plugin Reiter Einstellungen ‚Dienst neu starten‘” (no sign of life); V3 = 0 “keine Ziele eingetragen – im Plugin Reiter Sätze Ziele eintragen oder ‚Ziele aus Loxone übernehmen‘” (no targets); V1 < 0 “noch kein Satz verstanden – <v3> Ziele eingetragen; im Plugin Reiter Test einen Satz durchschicken” (no sentence yet); V2 = 1 “Ansagen still (Ruhezeit oder von Loxone stillgelegt) – letzter verstandener Satz vor etwa <v1> s” (announcements muted); without condition “letzter verstandener Satz vor etwa <v1> s – <v3> Ziele, Ansagen frei” (last sentence); visualisation ON | V1 = #8, V2 = #7, V3 = #6, V4 = output E of #12"
Z2_01 = "Virtual Text Input | sprachsteuerung_wohnzimmer_licht_aktion | create by hand, name exactly like this (the name the MQTT gateway assigns); what the last sentence wanted for the target “Licht im Wohnzimmer”: ein, aus or wert (dim); 2 seconds later the plugin resets it to “-” – so the same command also works twice in a row; MQTT gateway version 2: tick (no “Noncached” needed) | —"
Z2_02 = "Virtual Input (name as the MQTT gateway assigns it, plugin Sprachsteuerung) | sprachsteuerung_wohnzimmer_licht_wert | Analog on; display name “Helligkeit per Sprache (Sprachsteuerung)”; the number given in %% (0–100), only if the sentence names one (“dimme das wohnzimmer auf 40”); output to the brightness input of your own dimmer (not part of the list) | —"
Z2_03 = "Status | Wohnzimmerlicht ein per Sprache (Sprachsteuerung) | Rows: V1 == “ein” “per Sprache eingeschaltet” (switched on by voice), status value 1; without condition “–”, status value 0; visualisation OFF (logic only) | V1 = #1"
Z2_04 = "Status | Wohnzimmerlicht aus per Sprache (Sprachsteuerung) | Rows: V1 == “aus” “per Sprache ausgeschaltet” (switched off by voice), status value 1; without condition “–”, status value 0; visualisation OFF (logic only) | V1 = #1"
Z2_05 = "Edge Detection | Impuls Wohnzimmerlicht ein (Sprachsteuerung) | Pd 0.1 s; the output On (rising edge) is used; to the switch-on input of your own lighting or switching block (not part of the list) | Input = output AQ of #3"
Z2_06 = "Edge Detection | Impuls Wohnzimmerlicht aus (Sprachsteuerung) | Pd 0.1 s; the output On is used; to the off input of your own block (not part of the list) – at “Off” of a lighting controller a pulse longer than 200 ms locks the block, hence 0.1 s | Input = output AQ of #4"
Z2_07 = "Virtual Input (name as the MQTT gateway assigns it, plugin Sprachsteuerung) | sprachsteuerung_wohnzimmer_heizung_wert | Analog on; display name “Solltemperatur per Sprache (Sprachsteuerung)”; temperature given in °C (the target allows 5–30), only if the sentence names one (“stelle die heizung auf 21 grad”); output to your own setpoint, e.g. an analogue memory in front of the room controller (not part of the list) | —"
Z2_08 = "Virtual Input (name as the MQTT gateway assigns it, plugin Sprachsteuerung) | sprachsteuerung_ok | Analog on; display name “Satz ausgeführt (Sprachsteuerung)”; 1 = understood and carried out, 0 = not (applies to spoken sentences and to “Sprachsteuerung: Satz schicken”) | —"
Z2_09 = "Virtual Text Input | sprachsteuerung_satz | title exactly like this (the name the MQTT gateway assigns), “Use in visualisation” on; the sentence heard, spaces as underscores (“schalte_das_licht_im_wohnzimmer_aus”) | —"
Z2_10 = "Virtual Text Input | sprachsteuerung_grund | title exactly like this; why a sentence was not executed: kein_muster, ziel_unbekannt, ziel_fehlt, llm_fehler, rueckfrage …; “-” = nothing to report | —"
Z2_11 = "Virtual Text Input | sprachsteuerung_antwort | title exactly like this, “Use in visualisation” on; the reply sentence of the system | —"
Z2_12 = "Virtual Text Input | sprachsteuerung_mikrofon | title exactly like this; which microphone listened – so Loxone knows from which room the command came; “-” without microphone (sentence from Loxone via MQTT or from the Test tab) | —"
Z2_13 = "Virtual Text Input | sprachsteuerung_ziel | title exactly like this; key of the device from the target list, e.g. wohnzimmer_licht | —"
Z2_14 = "Status | Letzter Sprachbefehl (Sprachsteuerung) | Rows: V3 := “kalender” “Kalenderfrage (<v4>): <v5>” (calendar question; := means begins with); V1 = 1 and V3 == “vorgemerkt” “vorgemerkt (<v4>): <v2> – <v5>” (scheduled); V1 = 1 “ausgeführt (<v4>): <v2> → <v6> – <v5>” (executed); V3 == “kein_muster” “nicht verstanden (<v4>): <v2> – im Plugin Reiter Sätze ein Satzmuster ergänzen” (not understood – add a sentence pattern in the plugin tab Sentences); V3 == “ziel_unbekannt” “Gerät nicht gefunden (<v4>): <v2> – im Plugin Reiter Sätze am Ziel einen Alias ergänzen” (device not found – add an alias at the target); V3 == “ziel_fehlt” “kein Gerät genannt (<v4>): <v2> – das Gerät nennen oder im Plugin Reiter Mikrofone dem Mikrofon einen Raum geben” (no device named – name it or give the microphone a room); V3 := “llm_” “Sprachmodell antwortet nicht oder falsch – im Plugin Reiter Dienste nachsehen” (language model does not answer); V3 == “rueckfrage” “Rückfrage: <v5>” (question back); V3 == “” “seit dem Neustart noch kein Satz” (no sentence since the restart); without condition “nicht ausgeführt (<v3>): <v2> – <v5>” (not executed); visualisation ON | V1 = #8, V2 = #9, V3 = #10, V4 = #12, V5 = #11, V6 = #13"
Z3_01 = "Virtual Input (name as the MQTT gateway assigns it, plugin Sprachsteuerung) | sprachsteuerung_ruhe | 1 = nothing is announced at the moment (further instance, the same input as on page “Sprachsteuerung”) | —"
Z3_02 = "Virtual Input (Push Button) | Türklingel (eigene Quelle) | 1 = it rings (further instance, the same placeholder as on “Dashboard Steuerung”, “Heimkino Steuerung” and “Kodi-NG Wiedergabe”); in your own project connect your own bell push button or the bell output of the Door Controller block to no. 3 instead of this button | —"
