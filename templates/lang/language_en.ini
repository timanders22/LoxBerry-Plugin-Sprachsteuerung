S1_TEXT = "Everything concerning MQTT is on the <i>MQTT</i> tab: the gateway state, the subscription to enter and the full topic list. Without this step nothing reaches the Miniserver."
S1_TITEL = "Step 1: set up MQTT"
S3_TEXT = "A virtual HTTP input that fetches the state. The important ones are <span class='sm-mono'>BEREIT</span> - how many microphones are really connected - and <span class='sm-mono'>DIENSTE</span>: otherwise a dead Whisper container looks exactly like a healthy system. A microphone that has not answered for days goes unnoticed until you stand in front of it and speak."
S3_TITEL = "Step 2: monitor the system state"
S4_ANSAGE = "<b>This is worth more than it sounds.</b> An announcement 'the garage door has been open for an hour' in the right room achieves more than any message on a screen nobody looks at. And the sentence path makes the voice logic usable from push buttons too."
S4_TEXT = "It also works the other way round: Loxone can have the system say something, feed it a sentence as if someone had spoken it, or mute announcements. A <i>virtual output</i> with the LoxBerry address is enough - or simply the ready-made template above."
S4_TITEL = "Step 3: Loxone speaks"
S5_TEXT = "The endpoint lives in the unauthenticated area so Loxone can reach it without credentials, and is therefore protected by a token. With <span class='sm-mono'>?selftest=1</span> you can check whether it is still correct <b>without anything happening</b> - the alternative would be to make the house talk. A new token invalidates all addresses already entered."
S5_TITEL = "Step 4: the token"
S6_ERLAEUTERUNG = "<b>On #3, #4 and #5:</b> these three are virtual inputs for TEXT, not numbers. In Loxone Config that is the 'use as text' checkbox - without it <span class='sm-mono'>ein</span> arrives as 0.<br><b>On #8 and #9:</b> only the AND with the target makes the command unambiguous. Without it 'lights off' in the kitchen also switches the living room.<br><b>On #11:</b> the threshold is deliberately high. Someone who says nothing for half an hour has no fault - they simply said nothing. What is meant is the AGE of the snapshot, not the time since the last sentence.<br><b>On #13 and #15:</b> the notification block only fires on a change from off to on. Never wire several sources directly to its input, combine them with an OR first.<br><b>On #16 and #17:</b> the way back. This lets the system speak up by itself - and keep quiet at night."
S6_TEXT = "What is rebuilt: a spoken command switches a light group, a failure of the voice chain is reported, and at night Loxone mutes the announcements. Loxone Config lists all blocks in the block search (F5)."
S6_TITEL = "Step 5: complete block list to rebuild 1:1"
S7_TEXT = "Call these addresses in a browser. The first one says whether the token is correct without anything happening."
S7_TITEL = "Step 6: cross-check"
