Z3_18 = "Virtual Output Command (template “LoxBerry MQTT-Gateway”, MQTT) | Sprachsteuerung: Ansagen stilllegen | Command on ON: publish %1$s/befehl/ruhe 1; command on OFF: publish %1$s/befehl/ruhe 0 (never retain). Also applies to announcements other plugins make via the voice control (e.g. Intercom when the bell rings); then leave the quiet hours in the plugin switched off; works with the tick “Accept commands via MQTT” alone | Input = #17"
