HINWEIS_GOOGLE_OHNE_TOKEN = "Google speakers (Chromecast 4 Lox NG) is selected, but no speech token is stored - until then the speakers of the voice devices speak."
H_ALEXA_GERAET = "One or more devices (comma separated), <span class='sm-mono'>gruppe:&lt;name&gt;</span> or <span class='sm-mono'>alle</span> - as Alexa-NG names them. Empty: the default device of Alexa-NG."
H_ALEXA_LAUT = "Empty: the device volume stays. Otherwise Alexa-NG sets it for the announcement and back afterwards."
H_ALEXA_TOKEN = "From the tab <i>Loxone integration</i> of Alexa-NG. It is treated like a password: never shown, not in the backup, never in an address (the call goes by POST to <span class='sm-mono'>127.0.0.1</span>). Leave empty to keep the stored one."
H_ANSAGE_ABSTAND_S = "Minimum gap between two announcements. Otherwise a Loxone block stuck in a loop produces any number in a row. 0 disables the limit."
H_ANSAGE_JE_TAG = "Maximum number of announcements within 24 hours. 0 means unlimited."
H_ANTWORTWEG = "Answer back to Loxone"
H_ANTWORTWEG_FELD = "The text on topic <span class='sm-mono'>/antwort</span> always goes to Loxone - this selection only concerns the spoken announcement."
H_ANTWORTWEG_TEXT = "Piper speaks the answer into the loudspeaker of the microphone that heard the question. Anyone in the next room hears nothing. Here you configure that the finished sentence additionally goes to Loxone: as text on MQTT topic <span class='sm-mono'>/antwort</span> for a virtual text input, and as an announcement via Music Server or Audioserver. The fields are the same as in the waste calendar and the departure assistant plugins."
H_BESTAETIGUNG_S = "How long the system waits for a 'yes' after asking back about a sensitive target. 0 disables the question - it then switches immediately."
H_CC_PRAEFIX = "The setting <i>MQTT topic</i> in Chromecast4lox, default <span class='sm-mono'>chromecast4lox</span>. The announcement goes to <span class='sm-mono'>&lt;prefix&gt;/&lt;speaker&gt;/cmd/tts</span> (QoS 1, not retained). Whether Chromecast4lox is there is told by <span class='sm-mono'>&lt;prefix&gt;/server/online</span>."
H_CC_ZIEL = "Name of the speaker as in Chromecast4lox (umlauts and spaces are rewritten as there) or <span class='sm-mono'>alle</span> for every speaker. The announcement volume is set in Chromecast4lox."
H_DIENST = "Voice service"
H_DIENSTE = "Where the voice services run"
H_GOOGLE = "Google speakers (Chromecast 4 Lox NG)"
H_GOOGLE_GERAET = "Empty: the default device of Chromecast 4 Lox NG. Otherwise a name from its device list, exactly as written there (e.g. <span class='sm-mono'>Küche Box</span>), several separated by commas, <span class='sm-mono'>gruppe:&lt;Name&gt;</span> or <span class='sm-mono'>alle</span>. Chromecast 4 Lox NG rejects an unknown name - it never becomes <i>alle</i>."
H_GOOGLE_LAUT = "Empty: the announcement volume of Chromecast 4 Lox NG. Otherwise the value applies to this announcement only, capped by its volume limit and quiet time; afterwards it restores the previous volume."
H_GOOGLE_TEXT = "Only for the audio output type <b>Google speakers (Chromecast 4 Lox NG)</b>. The announcement goes by POST to the speech endpoint of the Chromecast plugin on this LoxBerry (<span class='sm-mono'>127.0.0.1/plugins/chromecast-4lox-ng/index.php</span>, from its version 1.3.15). Set up there: tab <i>Settings</i>, section <i>Speech output for other plugins</i> - tick the box, set a speech token, optionally a default device. Quiet time, volume limit and chime of the Chromecast plugin apply here as well. Unlike <i>Chromecast4lox (via MQTT)</i> this path needs no broker. If the Chromecast plugin does not accept the announcement, the speakers of the voice devices speak as before; it never switches to another Google speaker. The Test tab says what applies."
H_GOOGLE_TOKEN = "The speech token from Chromecast 4 Lox NG (tab <i>Settings</i>, section <i>Speech output for other plugins</i>) - a different one from Alexa-NG's. It is treated like a password: never shown, not in the backup, never in an address (the call goes by POST to <span class='sm-mono'>127.0.0.1</span>). Leave empty to keep the stored one."
H_KONTEXT_S = "How long a mentioned target remains valid for follow-up sentences. This turns a list of commands into a conversation: 'living room light on' - 'brighter' - 'off'. 0 disables context."
H_LLM_EIN = "Only what no pattern matches goes to the model. If it is off, the system answers unknown input with 'I did not understand that' - more honest than a guessed action."
H_LOXONE = "Path to Loxone"
H_PROBE = "Creates a WAV file with the voice entered above via the saved Piper address, without creating a container. That lets you hear how a voice sounds before setting it up. Piper must be running."
H_RUHE = "Quiet hours and repeat limit"
H_RUHE_TEXT = "<b>Without quiet hours any Loxone block can make the house talk at three in the morning.</b> This plugin's announcement mechanism comes from the waste calendar plugin - the guard in front of it existed there from the start, here it did not until 0.9.11. During quiet hours the microphone loudspeaker stays silent too. An alarm can override it: the virtual output carries <span class='sm-mono'>&amp;dringend=1</span> for that."
H_TTS_MODE = "<b>off</b> (default): only the speakers of the voice devices speak. <b>Music Server</b> is the standard case for Loxone. <b>MusicServer4Home</b> and <b>custom template</b> use the template field below. The <b>original Loxone Audioserver</b> has no network call - there the announcement is built in Loxone Config (text generator at the TTS input), and the plugin delivers the text on MQTT topic <span class='sm-mono'>/ansage</span>. <b>Chromecast4lox</b> (via MQTT), <b>Alexa-NG</b> and <b>Google speakers (Chromecast 4 Lox NG)</b> (via its speech endpoint) are plugins on this LoxBerry (fields further down). Alexa itself is not built in: there is no official local interface for it."
H_TTS_STIMME = "Optionally a different Piper voice for announcements than the one the container was started with. If empty, the container's voice applies."
H_TTS_TEMPLATE = "Only for MusicServer4Home and custom template. Replaced are <span class='sm-mono'>{ip}</span>, <span class='sm-mono'>{port}</span>, <span class='sm-mono'>{zones}</span>, <span class='sm-mono'>{vol}</span>, <span class='sm-mono'>{lang}</span> and <span class='sm-mono'>{text}</span>. If empty, the MusicServer4Home default template applies."
H_TTS_ZONES = "One or more zones, comma separated: <span class='sm-mono'>2,4</span>. A per-zone volume works with the tilde: <span class='sm-mono'>2~15,4</span> - it takes precedence over the field below. A microphone can carry its own zone; the answer then arrives in the room where the question was asked."
H_URL = "Optional. The standard path is MQTT - for that the plugin needs no Miniserver credentials. For a direct call enter an address here; <span class='sm-mono'>{ziel}</span>, <span class='sm-mono'>{aktion}</span> and <span class='sm-mono'>{wert}</span> are replaced. <b>Credentials are shown masked here</b> - to change them, enter the whole address again."
H_VERSTEHEN = "How understanding works"
H_WAKEWORD = "The wake word service must know the wake word. Which ones it has actually loaded is shown by the <i>Query services</i> button on the Test tab - what the model does not know will not wake anything."
H_WARTEZEIT = "How long the interface and the Miniserver wait for the service to answer. A web server will not accept more than 12 seconds anyway; the service finishes the command regardless."
H_ZUSATZ = "Chromecast4lox and Alexa-NG"
H_ZUSATZ_TEXT = "Only for the audio output types <b>Chromecast4lox</b> and <b>Alexa-NG</b>. The respective plugin must run on this LoxBerry. If it does not accept the announcement (plugin missing, speaker unknown, no feedback within 10 s), the speakers of the voice devices speak as before - also with the answer path <i>Loxone only</i>. The Test tab says what applies."
