EINLEITUNG = "The voice control tells Loxone WHAT was meant. What happens next is decided by the Miniserver - so the logic stays where it belongs. Since 0.12.7 the sample project fetches the values via MQTT and sends announcements, sentences and muting to the plugin via MQTT. The HTTP endpoint is below for existing setups (tick “Accept the HTTP endpoint for Loxone”). Steps 2 to 4 each contain a fully wired page from the LoxBerry plugins sample project with instructions, table and picture."
