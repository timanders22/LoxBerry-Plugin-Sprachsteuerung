VERSTEHEN_ERKLAERUNG = "<b>Sentence patterns first, language model second.</b> That is not a cost saving but the better order: a pattern match takes milliseconds and cannot be wrong - it either matches or it does not. A language model takes seconds on a small machine and can be off. For 'lights on' you want the first. For 'make it a bit cosier in here' the second."
WAS_IST_DAS = "<b>Everything stays in the house.</b> Not a word leaves the home network: the microphone sends its audio to the LoxBerry, Whisper turns it into text, sentence patterns turn that into an intent, and the Miniserver switches. Piper speaks the answer - also here. There is no provider who could listen in, because there is no provider."

