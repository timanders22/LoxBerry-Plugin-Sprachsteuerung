EMPFEHLUNG = "<b>The most convenient way</b> is the row with the target topic: one topic per target. A virtual input then hangs on exactly <span class='sm-mono'>wohnzimmer/licht/aktion</span> and needs no case distinction in the Miniserver. Step 3 on the <i>Loxone integration</i> tab lists the names of these inputs for every target."
