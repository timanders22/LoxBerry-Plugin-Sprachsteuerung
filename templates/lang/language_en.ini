Z3_11 = "Virtual Input (Push Button) | Taste Licht aus per Satz (Sprachsteuerung) | in the app or on a push button; sends the sentence “schalte das licht im wohnzimmer aus” through the voice logic – the result arrives on page “Sprachsteuerung Befehle” like a spoken command | —"
Z3_12 = "Virtual Output Command (template “LoxBerry MQTT-Gateway”, MQTT) | Sprachsteuerung: Satz schicken | Command on ON: publish %1$s/befehl/satz schalte das licht im wohnzimmer aus (enter your own sentence as you would speak it); every press counts; ticks as no. 3 | Input = #11"
