L_HERZSCHLAG = "Heartbeat every (seconds)"
RETAIN_ERKLAERUNG = "<b>Retained</b> means the broker keeps the last value and hands it to every new subscriber straight away. After a restart of the Miniserver or the gateway the state is there again immediately, without waiting for the next heartbeat. States are retained, time-related readings are not - otherwise yesterday's value would look like a current one. The heartbeat (<span class='sm-mono'>online</span>, <span class='sm-mono'>ts</span>) is never retained: it would read 'alive' forever. Likewise never retained are statements of the service about itself - the result of the last sentence (<span class='sm-mono'>ok</span>, <span class='sm-mono'>grund</span>, <span class='sm-mono'>antwort</span>) and its connections (<span class='sm-mono'>bereit</span>, <span class='sm-mono'>dienste_ok</span>) - and <span class='sm-mono'>ruhe</span>, because quiet hours change with the clock alone. The commands to the targets (<span class='sm-mono'>thema/aktion</span>, <span class='sm-mono'>thema/wert</span>) are transient as well: after a restart of the broker or the gateway they must not arrive a second time. Since 0.11.10; the old value is deleted until the broker confirms that none is left."
RETAIN_GEMESSEN = "<b>Measured on the device (13 Sep 2026):</b> the gateway UDP inlet accepts the command word <span class='sm-mono'>retain</span>; topics sent that way were then held in the broker, those sent with <span class='sm-mono'>publish</span> were not. Up to 0.11.4 everything was sent transiently. This house runs gateway <b>version 1</b>. An empty value is always sent transiently - an empty payload deletes a retained topic."
