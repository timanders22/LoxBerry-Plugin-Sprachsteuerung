; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped.

[HILFE]
K01 = "Local voice control"
K02 = "<b>Not a word leaves the house.</b> Speech recognition, interpretation and speech output all run on the LoxBerry itself. There is no account, no provider and no internet connection in operation — only during installation, to fetch the containers and models."
K03 = "The chain is always the same: <i>microphone → speech recognition (Whisper) → interpretation → MQTT to Loxone → answer through the speech output (Piper) back to the microphone.</i> What comes of it is the Miniserver's decision. The plugin only tells it WHAT was meant."
K04 = "Four containers, three of them mandatory"
K05 = "<b>Whisper</b> understands spoken language. Without it nothing works."
K06 = "<b>Piper</b> speaks the answer. Without it everything still switches, but it stays silent."
K07 = "<b>Wake word</b> (openWakeWord) listens for the wake word. Only needed for microphones that cannot do it themselves."
K08 = "<b>Language model</b> (llama.cpp) is the safety net for sentences that match no pattern. <b>Optional</b> — and better switched off on small hardware."
K09 = "The <i>Services</i> tab sets them up with one button: <i>Set up voice services</i> pulls the images, creates the containers and starts them, in the background, with status lights per service. Under <i>Manage individually</i> they can still be started, stopped and removed one by one. Docker has to be installed on the LoxBerry for that; the plugin does not bring it along - the LoxBerry plugin <a href='https://github.com/timanders22/LoxBerry-Plugin-Docker-NG' target='_blank'>Docker NG</a> does."
K10 = "Which models fit — the memory decides"
K11 = "The <i>Services</i> tab reads out the architecture, cores, memory and graphics card and suggests matching models. The rule of thumb behind it: below about 3.5&nbsp;GB only the smallest Whisper model makes sense and a language model none at all; from about 15&nbsp;GB, or with a graphics card, the large one runs too. <b>Speed figures appear nowhere on purpose</b>, because without your hardware they would be guesswork. The <i>Measure</i> button measures them on your machine instead."
K12 = "Microphones"
K13 = "Two families are supported, mixed and at the same time:"
K14 = "<b>Wyoming satellites</b> — the open protocol behind Home Assistant Voice. Anything that speaks Wyoming satellite can be entered with an address and port: the Voice PE hardware, a Raspberry Pi running wyoming-satellite, a home-built microphone."
K15 = "<b>ESPHome microphones</b> — directly through the native API (port 6053) with their encryption key."
K16 = "The ESPHome path is the least proven part of the plugin. It is therefore built so that a failure there does not drag the Wyoming microphones down with it."
K17 = "How a sentence is interpreted"
K18 = "First the patterns on the <i>Sentences</i> tab: <span class='sm-mono'>[schalte|mach] {ziel} [an|ein]</span>. Square brackets are alternatives, curly ones placeholders. They are fast, comprehensible and always give the same result. If no pattern matches and the language model is switched on, it is asked — but it may only name targets that are in the list. Invented targets are discarded."
K19 = "Umlauts, capitalisation and punctuation make no difference. „Küche“, „kueche“ and „Kuche“ are the same thing."
K20 = "How to proceed"
K21 = "<b>Services:</b> look at the recommendation, press <i>Set up voice services</i> and wait until the status lights show <i>ready</i>."
K22 = "<b>Settings:</b> enter the wake word, the language and the Miniserver, start the service."
K23 = "<b>Test:</b> the self-check walks the whole chain and also calls our own endpoint. Then type a sentence below — first as a <i>dry run</i> (interprets only, does not switch), then for real. This is the best test available here: it needs no microphone and still checks everything from speech recognition onwards."
K24 = "<b>Microphones:</b> only now enter them — and give each one its <i>room</i> and <i>zone</i> straight away. A later <span class='sm-mono'>switch on</span> is then enough, and the answer arrives in the right room."
K25 = "<b>MQTT:</b> the tab shows the gateway state, the subscription to enter and all topics. Under gateway V1 the entry is mandatory; under V2 the field is gone and the data points are ticked instead."
K26 = "<b>Loxone integration:</b> step by step, with a complete list of blocks."
K27 = "When it does not understand"
K28 = "The <i>Test</i> tab shows under <i>What was understood last</i> what the speech recognition heard. Very often it says something other than what was spoken — then it is the microphone, the room or the model, not the sentence pattern. If the sentence is there correctly and still nothing is switched, a pattern or a target is missing."
K29 = "What has not been tested"
K30 = "This plugin was built without a microphone. The whole chain was tested against stubs that use the <i>original package</i> of the Wyoming protocol. Whether a particular microphone delivers audio that Whisper understands, whether the wake word responds in your room and whether ESPHome microphones carry the audio path can only be shown by real hardware."
K31 = "Basis"
K32 = "The Wyoming protocol and the container images come from the Rhasspy project (MIT), the language model from llama.cpp (MIT). The protocol details were measured against the published <span class='sm-mono'>wyoming</span> package, not merely read."
K33 = "Quiet hours — so the nights stay quiet"
K34 = "Without quiet hours any Loxone block can make the house talk at three in the morning. The <i>Settings</i> tab has a night window; it applies to the microphone loudspeaker as well. An alarm may override it — the virtual output carries <span class='sm-mono'>&amp;dringend=1</span> for that. And Loxone can mute announcements at any time: <span class='sm-mono'>&amp;aktion=ruhe&amp;wert=1</span>."
K35 = "Answering questions instead of only switching"
K36 = "A target can carry a read address (field <i>Read</i> on the Sentences tab). The plugin fetches it and inserts the answer as <span class='sm-mono'>{istwert}</span> into the answer text. Only with that does the system answer questions like ‘how warm is it in the living room’ — before it stayed silent."
K37 = "When a sentence gets lost on the way"
K38 = "Five counterparts are involved: microphone, speech recognition, speech synthesis, language model and the MQTT gateway. The log only shows the result. The <i>trace</i> on the Log files tab shows the path — as a deadline, not a switch: it stops by itself, because these logs live on a RAM disk."
K39 = "Set up voice services - what exactly happens"
K40 = "The button works in the background: it asks Docker what is missing, pulls missing images (often several gigabytes the first time, at most one hour per image), creates the containers and starts stopped ones. The page shows <i>step x of y</i> and reloads itself; each step is also written to the plugin log. Remote services and containers that do not belong to this plugin are left alone, with the reason. Own containers carry the label <span class='sm-mono'>de.loxberry.plugin.name=sprachsteuerung</span>."
K41 = "If the page says Docker is missing or not responding: install the LoxBerry plugin <a href='https://github.com/timanders22/LoxBerry-Plugin-Docker-NG' target='_blank'>Docker NG</a> and restart the LoxBerry once afterwards. On uninstall this plugin removes its own containers; LoxBerry removes the model folder together with the data folder."
K42 = "Announcement via Chromecast4lox or Alexa-NG (off by default)"
K43 = "In the <i>Settings</i> tab, <i>Type of audio output</i> selects a further device the announcements additionally go to: Loxone Music Server, MusicServer4Home, a custom template, the text for the original Loxone Audioserver - or the plugins <b>Chromecast4lox</b> (via MQTT) and <b>Alexa-NG</b> (via its endpoint). The default is <i>off</i>, and the speakers of the voice devices speak as before. If Chromecast4lox or Alexa-NG does not accept an announcement, the speakers of the voice devices speak as well, and the <i>Test</i> tab says why. The speech token of Alexa-NG is treated like a password. Alexa itself is not built in: there is no official local interface, only unofficial ones using Amazon login cookies."
K44 = "Announcement via Google speakers (Chromecast 4 Lox NG, not selected by default)"
K45 = "Under <i>Type of audio output</i> there is the choice <b>Google speakers (Chromecast 4 Lox NG)</b>. The announcement then goes by POST to the speech endpoint of the Chromecast plugin on this LoxBerry (from its version 1.3.15). Set up there: tab <i>Settings</i>, section <i>Speech output for other plugins</i> - tick the box, set a speech token, optionally a default device. Here you enter the device (empty = default device), the speech token (a different one from Alexa-NG's) and optionally a volume. An announcement counts as sent only if the Chromecast plugin accepts it (<span class='sm-mono'>SPRECHEN;OK=1</span>); otherwise the speakers of the voice devices speak, and log, notification and the <i>Test</i> tab give HTTP code and reason. It never switches to another Google speaker. The speech token is treated like a password and is not in the backup."
K46 = "Editing sentences and targets without losing anything"
K47 = "The target form on the <i>Sentences</i> tab only overwrites its own columns. Anything else a target carries - its own Miniserver address, uuid or fields from the raw text - is kept on save. A target is deleted with the <i>Delete</i> checkbox in its row. A key with characters that do not work as an MQTT topic is rejected with a suggestion instead of being rewritten silently. After a rejection the inputs are back in the form - including a long raw text with one comma too many; the browser names line and column before sending."
K48 = "Before every save of the sentence file from the interface the previous version is kept, the last five. Under <i>Earlier versions of the sentence file</i> a button restores one of them; the version before that is kept as a version itself."
K49 = "<i>Preview the voice</i> saves nothing - afterwards the inputs are back in the form and only apply after <i>Save</i>. The addresses on the <i>Loxone integration</i> tab name the LoxBerry as stated above them (from the network settings or, if those cannot be read, from the browser's address bar). Log and trace can be downloaded on the <i>Log files</i> tab."
K50 = "Announcements via Sonos (Sonos4Lox)"
K51 = "Under <i>Audio output type</i> you can choose <b>Sonos (Sonos4Lox)</b>. Announcements then go to the Sonos4Lox plugin on this LoxBerry (<span class='sm-mono'>action=say</span>). Enter the <b>zone</b> as named in Sonos4Lox (without a zone Sonos4Lox does not speak) and optionally a volume (empty = Sonos4Lox's own). An alarm with <span class='sm-mono'>dringend=1</span> goes out as an urgent announcement. Sonos4Lox has no self-test; the <i>Test</i> tab therefore only checks zone and installation - a probe would speak."
K52 = "Output per room"
K53 = "In the <i>Microphones</i> tab, each row has an expandable <i>Output of this room</i>: Alexa device, Google speaker, Chromecast4lox speaker and Sonos zone for this microphone only. Empty means: as in <i>Settings</i>. So the kitchen answers through the kitchen speaker even if announcements otherwise go to the living room. An entry only applies with the matching <i>audio output type</i>."
K54 = "Permanent broker connection and commands via MQTT"
K55 = "By default the service connects only briefly to send. With <i>Permanent connection to the broker</i> in the <i>MQTT</i> tab it stays connected and listens on <span class='sm-mono'>&lt;prefix&gt;/cmd/sprechen</span> (announce text), <span class='sm-mono'>/cmd/satz</span> (process a sentence) and <span class='sm-mono'>/cmd/ruhe</span> (0/1). It reports <span class='sm-mono'>/mikrofon/&lt;name&gt;/zustand</span>, <span class='sm-mono'>/ansage_ok</span> and <span class='sm-mono'>/ansage_grund</span>; the broker sets <span class='sm-mono'>/online</span> to 0 as last will when the connection drops. A target can then also read its value from an MQTT topic: <span class='sm-mono'>mqtt:&lt;topic&gt;</span> in the <i>Read</i> field (without # and +). For MQTT gateway V1 the plugin writes the subscription file <span class='sm-mono'>mqtt_subscriptions.cfg</span> itself; gateway V2 does not read this file - subscribe to <span class='sm-mono'>&lt;prefix&gt;/#</span> in the gateway's own subscriptions there."
K56 = "Lowering and controlling music"
K57 = "In the <i>Settings</i> tab (section <i>Music</i>, off by default): <b>Lower the music</b> reduces the music of the microphone's zone to the set volume (0 to 100) as soon as it listens and restores it after the answer (after 60 s at the latest); <b>Control music by voice</b> accepts sentences without a target like “louder”, “quieter”, “pause”, “resume”, “next track” or “previous track”. Both only work with the Loxone Music Server as audio output type and a zone on the microphone; MusicServer4Home does not offer this interface. The page points this out if another type is selected."
K58 = "Managing timers"
K59 = "“Turn off the light in 10 minutes” creates a timer. Ask with “which timers are running”, cancel with “cancel timer” (or “cancel the timer for the living room”). “Remind me in 10 minutes about the cake” announces the text when due - the same way as any announcement, so quiet hours apply. The <i>Test</i> tab shows running timers. These sentences are built in (German and English) and also work with an older sentence file."
K60 = "Relative commands and several commands in one sentence"
K61 = "“Brighter”, “darker” or “two degrees warmer” change a value relative to the current one. How much a “brighter” without a number changes is set in the <i>Step</i> column of the target table (a number greater than 0; empty = the service default); <i>min</i> and <i>max</i> limit the result. The target needs a read address, otherwise the current value is unknown. Two commands in one sentence (“turn off the kitchen and turn on the living room”) are both carried out if each part is recognised unambiguously on its own; otherwise nothing is switched and the system asks back. A sentence with a negation (“not the light”) switches nothing."
K62 = "Miniserver addresses with ms:// and Loxone import"
K63 = "Instead of <span class='sm-mono'>http://user:password@ip/...</span> an address may be <span class='sm-mono'>ms://1/jdev/sps/io/...</span>: Miniserver no. 1 to 99 from the LoxBerry settings (<i>System → Miniserver</i>). The service inserts address, port, https and login itself - so no password is stored in the sentence file or the backup. This applies to the Miniserver address, a target's address and the read address. The <i>Loxone import</i> in the <i>Sentences</i> tab offers the Miniservers from LoxBerry; imported targets get their uuid and a read address <span class='sm-mono'>ms://&lt;no&gt;/jdev/sps/io/&lt;uuid&gt;/state</span>."
K64 = "Per-target template and the service after a web server restart"
K65 = "The per-target template is called <span class='sm-mono'>VIU_Sprachsteuerung_Ziele.xml</span> - a virtual UDP input fed by the MQTT gateway. The gateway only sends changed values: for the same action to arrive twice, mark the action topics as <i>Noncached</i> in the gateway. If the service was started from the web interface and the web server is restarted afterwards, it ends with it; the watchdog restarts it within one minute."
