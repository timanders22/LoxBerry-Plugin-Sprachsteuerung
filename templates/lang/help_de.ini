; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Sprachsteuerung lokal"
K02 = "<b>Kein Wort verlässt das Haus.</b> Spracherkennung, Deutung und Sprachausgabe laufen auf dem LoxBerry selbst. Es gibt kein Konto, keinen Anbieter und keine Internetverbindung im Betrieb — nur bei der Installation, um die Container und Modelle zu holen."
K03 = "Die Kette ist immer dieselbe: <i>Mikrofon → Spracherkennung (Whisper) → Deutung → MQTT an Loxone → Antwort über die Sprachausgabe (Piper) zurück ins Mikrofon.</i> Was daraus wird, entscheidet der Miniserver. Das Plugin sagt ihm nur, WAS gemeint war."
K04 = "Vier Container, drei davon Pflicht"
K05 = "<b>Whisper</b> versteht gesprochene Sprache. Ohne ihn geht nichts."
K06 = "<b>Piper</b> spricht die Antwort. Ohne ihn schaltet zwar alles, aber es bleibt still."
K07 = "<b>Wortwecker</b> (openWakeWord) horcht auf das Weckwort. Nur für Mikrofone nötig, die das nicht selbst können."
K08 = "<b>Sprachmodell</b> (llama.cpp) ist die Auffanglinie für Sätze, die auf kein Muster passen. <b>Freiwillig</b> — und auf kleiner Hardware besser aus."
K09 = "Der Reiter <i>Dienste</i> legt sie an, startet, stoppt und zeigt ihre Logdateien. Docker muss dazu auf dem LoxBerry installiert sein; das Plugin bringt es nicht mit."
K10 = "Welche Modelle passen — das entscheidet der Arbeitsspeicher"
K11 = "Der Reiter <i>Dienste</i> liest Architektur, Kerne, Speicher und Grafikkarte aus und schlägt dazu passende Modelle vor. Die Faustregel dahinter: unter etwa 3,5&nbsp;GB ist nur das kleinste Whisper-Modell sinnvoll und ein Sprachmodell gar nicht; ab etwa 15&nbsp;GB oder mit Grafikkarte läuft auch das große. <b>Geschwindigkeitsangaben stehen bewusst nirgends</b>, weil sie ohne Ihre Hardware geraten wären. Der Knopf <i>Messen</i> misst sie stattdessen bei Ihnen."
K12 = "Mikrofone"
K13 = "Zwei Familien werden bedient, gemischt und gleichzeitig:"
K14 = "<b>Wyoming-Satelliten</b> — das offene Protokoll hinter Home Assistant Voice. Alles, was einen Wyoming-Satelliten spricht, lässt sich mit Adresse und Port eintragen: die Voice-PE-Hardware, ein Raspberry Pi mit wyoming-satellite, ein selbstgebautes Mikrofon."
K15 = "<b>ESPHome-Mikrofone</b> — direkt über die native API (Port 6053) mit ihrem Verschlüsselungsschlüssel."
K16 = "Der ESPHome-Weg ist der am wenigsten erprobte Teil des Plugins. Er ist deshalb so gebaut, dass ein Fehler dort die Wyoming-Mikrofone nicht mitreißt."
K17 = "Wie ein Satz gedeutet wird"
K18 = "Zuerst die Muster im Reiter <i>Sätze</i>: <span class='sm-mono'>[schalte|mach] {ziel} [an|ein]</span>. Eckige Klammern sind Alternativen, geschweifte Platzhalter. Sie sind schnell, nachvollziehbar und liefern immer dasselbe Ergebnis. Passt kein Muster und ist das Sprachmodell eingeschaltet, wird es gefragt — es darf aber nur Ziele nennen, die in der Liste stehen. Erfundene Ziele werden verworfen."
K19 = "Umlaute, Großschreibung und Satzzeichen spielen keine Rolle. „Küche“, „kueche“ und „Kuche“ sind dasselbe."
K20 = "So gehen Sie vor"
K21 = "<b>Dienste:</b> Empfehlung ansehen, Container anlegen und starten."
K22 = "<b>Einstellungen:</b> Weckwort, Sprache und Miniserver eintragen, Dienst starten."
K23 = "<b>Test:</b> Die Selbstprüfung geht die Kette durch und ruft dabei auch den eigenen Endpunkt auf. Danach unten einen Satz eintippen — erst als <i>Trockenlauf</i> (deutet nur, schaltet nicht), dann wirklich. Das ist der beste Test, den es hier gibt: er braucht kein Mikrofon und prüft trotzdem alles ab der Spracherkennung."
K24 = "<b>Mikrofone:</b> erst jetzt eintragen — und je Mikrofon gleich den <i>Raum</i> und die <i>Zone</i> mit. Damit genügt später ein <span class='sm-mono'>mach an</span>, und die Antwort kommt im richtigen Zimmer."
K25 = "<b>MQTT:</b> Der Reiter zeigt den Zustand des Gateways, das einzutragende Abo und alle Themen. Unter Gateway V1 ist der Eintrag Pflicht; unter V2 gibt es das Feld nicht mehr, dort werden die Datenpunkte angehakt."
K26 = "<b>Einbindung in Loxone:</b> Schritt für Schritt, mit vollständiger Baustein-Liste."
K27 = "Wenn es nicht versteht"
K28 = "Der Reiter <i>Test</i> zeigt unter <i>Was zuletzt verstanden wurde</i>, was die Spracherkennung gehört hat. Sehr oft steht dort etwas anderes, als gesagt wurde — dann liegt es am Mikrofon, am Raum oder am Modell und nicht am Satzmuster. Steht der Satz richtig da und wird trotzdem nichts geschaltet, fehlt ein Muster oder ein Ziel."
K29 = "Was ungeprüft ist"
K30 = "Dieses Plugin wurde ohne Mikrofon gebaut. Geprüft wurde die ganze Kette gegen Attrappen, die das <i>Originalpaket</i> des Wyoming-Protokolls benutzen. Ob ein bestimmtes Mikrofon Audio liefert, das Whisper versteht, ob das Weckwort in Ihrem Raum anspricht und ob ESPHome-Mikrofone den Audioweg tragen, kann nur echte Hardware zeigen."
K31 = "Grundlage"
K32 = "Wyoming-Protokoll und die Container-Abbilder stammen aus dem Rhasspy-Projekt (MIT), das Sprachmodell aus llama.cpp (MIT). Die Protokollangaben wurden gegen das veröffentlichte Paket <span class='sm-mono'>wyoming</span> gemessen, nicht nur gelesen."
K33 = "Ruhezeit — damit nachts Ruhe ist"
K34 = "Ohne Ruhezeit kann jeder Loxone-Baustein um drei Uhr nachts das Haus reden lassen. Im Reiter <i>Einstellungen</i> steht ein Nachtfenster; es gilt auch für den Lautsprecher des Mikrofons. Ein Alarm darf es übergehen — dafür trägt der virtuelle Ausgang <span class='sm-mono'>&amp;dringend=1</span>. Und Loxone kann die Ansagen jederzeit stilllegen: <span class='sm-mono'>&amp;aktion=ruhe&amp;wert=1</span>."
K35 = "Fragen beantworten statt nur schalten"
K36 = "Ein Ziel kann eine Leseadresse tragen (Feld <i>Lesen</i> im Reiter Sätze). Das Plugin ruft sie ab und setzt die Antwort als <span class='sm-mono'>{istwert}</span> in den Antworttext ein. Erst damit beantwortet die Anlage Fragen wie „wie warm ist es im Wohnzimmer“ — vorher blieb sie darauf stumm."
K37 = "Wenn ein Satz unterwegs verlorengeht"
K38 = "Fünf Gegenstellen sind beteiligt: Mikrofon, Spracherkennung, Sprachausgabe, Sprachmodell und der MQTT-Gateway. Das Protokoll zeigt nur das Ergebnis. Der <i>Mitschnitt</i> im Reiter Logdateien zeigt den Weg — als Frist, nicht als Schalter: er hört von selbst wieder auf, weil diese Protokolle auf einer Ramdisk liegen."
